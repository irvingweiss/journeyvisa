<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600"
     role="img" aria-labelledby="hero-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="hero-title">A visa application form beside a passport, with an approval stamp</title>

  <!-- Palette is the site's own: teal #0f766e, deep #06302c, slate greys.
       Deliberately abstract. No faces, no flags, no seals that could be read
       as a government mark. -->

  <defs>
    <clipPath id="frame">
      <rect x="0" y="0" width="800" height="600" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="800" height="600" fill="#eef2f6"/>
    <circle cx="672" cy="118" r="188" fill="#f0fdfa"/>
    <circle cx="96" cy="536" r="128" fill="#e6eef3"/>

    <!-- passport, sitting behind and to the left -->
    <g transform="rotate(-9 250 330)">
      <rect x="118" y="168" width="252" height="330" rx="18" fill="#06302c"/>
      <rect x="118" y="168" width="252" height="330" rx="18" fill="none" stroke="#0a3f39" stroke-width="2"/>
      <circle cx="244" cy="272" r="42" fill="none" stroke="#99f6e4" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.75"/>
      <path d="M226 273l13 13 26-28" fill="none" stroke="#99f6e4" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
      <rect x="182" y="352" width="124" height="8" rx="4" fill="#0f766e"/>
      <rect x="196" y="376" width="96" height="6" rx="3" fill="#134e4a"/>
      <rect x="208" y="396" width="72" height="6" rx="3" fill="#134e4a"/>
    </g>

    <!-- the application itself, front and centre -->
    <g transform="rotate(3 500 330)">
      <rect x="308" y="112" width="392" height="424" rx="16" fill="#ffffff"/>
      <rect x="308" y="112" width="392" height="424" rx="16" fill="none" stroke="#cbd5e1" stroke-width="2"/>
      <path d="M308 128a16 16 0 0 1 16-16h360a16 16 0 0 1 16 16v44H308z" fill="#0f766e"/>
      <rect x="336" y="134" width="132" height="9" rx="4.5" fill="#ffffff" opacity="0.95"/>
      <rect x="336" y="152" width="84" height="7" rx="3.5" fill="#ffffff" opacity="0.6"/>

      <!-- photograph placeholder, abstract on purpose -->
      <rect x="336" y="204" width="98" height="118" rx="8" fill="#e2e8f0"/>
      <circle cx="385" cy="248" r="21" fill="#cbd5e1"/>
      <path d="M352 312a33 33 0 0 1 66 0z" fill="#cbd5e1"/>

      <!-- answered fields -->
      <rect x="454" y="206" width="106" height="7" rx="3.5" fill="#cbd5e1"/>
      <rect x="454" y="224" width="216" height="12" rx="6" fill="#f1f5f9"/>
      <rect x="454" y="256" width="88" height="7" rx="3.5" fill="#cbd5e1"/>
      <rect x="454" y="274" width="216" height="12" rx="6" fill="#f1f5f9"/>
      <rect x="454" y="306" width="120" height="7" rx="3.5" fill="#cbd5e1"/>

      <rect x="336" y="356" width="334" height="12" rx="6" fill="#f1f5f9"/>
      <rect x="336" y="388" width="292" height="12" rx="6" fill="#f1f5f9"/>

      <!-- a checked confirmation row -->
      <rect x="336" y="428" width="22" height="22" rx="5" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
      <path d="M341 439l5 5 11-12" fill="none" stroke="#0f766e" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="370" y="434" width="188" height="9" rx="4.5" fill="#cbd5e1"/>

      <rect x="336" y="478" width="150" height="34" rx="8" fill="#0f766e"/>
      <rect x="360" y="491" width="102" height="8" rx="4" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- approval stamp, overlapping both -->
    <g transform="rotate(-14 640 452)" opacity="0.92">
      <circle cx="640" cy="452" r="58" fill="none" stroke="#0f766e" stroke-width="5"/>
      <circle cx="640" cy="452" r="46" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="5 6"/>
      <path d="M617 453l16 16 31-34" fill="none" stroke="#0f766e" stroke-width="8"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
